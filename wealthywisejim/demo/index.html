<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Jimooth Mahendra · Programme concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{--ground:#12224A;--surface:#1C3168;--ink:#F5F7FA;--muted:#9AA7C7;--accent:#E8A33D;--accent-ink:#12224A;--rule:#48577C;--positive:#6CC497;--font-display:'Sora', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;--font-body:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}</style>
<style>/* Creator demo kit: app styles. Every colour comes from the theme tokens on :root. */

:root {
  --top-h: 56px;
  --nav-h: 64px;
  --badge-h: 0px;
  --chrome-bottom: var(--nav-h);

  --line: var(--rule);
  --line-strong: color-mix(in srgb, var(--ink) 38%, var(--rule));
  --ink-2: color-mix(in srgb, var(--ink) 82%, var(--ground));
  --muted-line: color-mix(in srgb, var(--muted) 45%, transparent);
  --accent-tint: color-mix(in srgb, var(--accent) 10%, transparent);
  --accent-tint-2: color-mix(in srgb, var(--accent) 18%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 55%, transparent);
  --positive-tint: color-mix(in srgb, var(--positive) 11%, transparent);
  --positive-line: color-mix(in srgb, var(--positive) 55%, transparent);
  --panel: color-mix(in srgb, var(--surface) 62%, var(--ground));
  --field: color-mix(in srgb, var(--ground) 60%, var(--surface));
  --track: color-mix(in srgb, var(--muted) 26%, transparent);

  --r-sm: 4px;
  --r: 6px;
  --r-lg: 10px;
  --pad-x: 56px;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--ground);
  scroll-padding-top: calc(var(--top-h) + 12px);
  scroll-padding-bottom: calc(var(--chrome-bottom) + 12px);
}

body {
  margin: 0;
  min-height: 100vh;
  padding-top: var(--top-h);
  padding-bottom: var(--chrome-bottom);
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1, h2, h3, h4 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.015em;
  color: var(--ink);
}
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
dl, dd { margin: 0; }
figure { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
table { border-collapse: collapse; }
::selection { background: var(--accent-tint-2); }

.icon { flex: none; display: block; }
.fig, .num, [data-value], time, .tnum { font-variant-numeric: tabular-nums; }
/* Figures inside running text are wrapped in .tnum by the script rather than setting tabular
   figures on body: the body font's tabular set also widens the hyphen ("mock - up"). */

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* Small statement-style column label. Small caps keep the source text in sentence case. */
.label {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  font-variant-caps: all-small-caps;
  letter-spacing: 0.09em;
  line-height: 1.3;
  color: var(--muted);
}
.label-accent { color: var(--accent); }

.noscript { padding: 40px; }

/* ================================================================ top bar */

.topbar {
  position: fixed;
  z-index: 20;
  top: 0; left: 0; right: 0;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 0 28px;
  background: var(--ground);
  border-bottom: 1px solid var(--line);
}
.tb-id {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  max-width: calc(50% - 250px);
}
.tb-avatar {
  flex: none;
  width: 30px; height: 30px;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--accent);
  border-radius: 8px;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.tb-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-handle { font-size: 13px; color: var(--muted); white-space: nowrap; }
.tb-counter {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
  max-width: calc(50% - 250px);
  font-size: 13.5px;
  white-space: nowrap;
}
.tb-count { flex: none; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.tb-sep { color: var(--muted); }
.tb-screen { overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

/* ================================================================ badge */

.badge {
  position: fixed;
  z-index: 40;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 12px;
  border: 1px solid var(--muted-line);
  border-radius: 999px;
  background: var(--ground);
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1;
  white-space: nowrap;
  pointer-events: none;
}
.badge::before {
  content: '';
  flex: none;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

/* ================================================================ bottom nav */

.nav {
  position: fixed;
  z-index: 20;
  left: 0; right: 0; bottom: 0;
  height: 64px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  background: var(--ground);
  border-top: 1px solid var(--line);
}
.pager {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  min-width: 44px;
  min-height: 44px;
  max-width: 100%;
  padding: 4px 12px;
  border: 0;
  border-radius: var(--r);
  background: transparent;
  color: var(--ink);
  text-align: left;
}
.pager-prev { justify-self: start; }
.pager-next { justify-self: end; text-align: right; }
.pager-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.pager-k { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.pager-name { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pager:not(:disabled):hover .pager-name { color: var(--accent); }
.pager:not(:disabled):hover .icon { color: var(--accent); }
.pager:disabled { opacity: 0.35; }

.dots { display: flex; align-items: center; }
.dot {
  display: grid;
  place-items: center;
  width: 28px; height: 44px;
  border-radius: var(--r-sm);
  text-decoration: none;
}
.dot-mark {
  display: block;
  width: 8px; height: 8px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--muted) 80%, transparent);
}
.dot:hover .dot-mark { background: var(--ink-2); }
.dot[aria-current="step"] .dot-mark { width: 20px; background: var(--accent); }

/* ================================================================ screens */

main { display: block; }

.screen {
  max-width: 1312px;
  margin: 0 auto;
  padding: 26px var(--pad-x) 24px;
}
.screen.is-active { animation: screen-in 180ms ease-out; }
@keyframes screen-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.screen-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 40px;
  margin-bottom: 24px;
}
.screen-head-main { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; min-width: 0; }
.screen-title {
  font-size: 40px;
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.025em;
  max-width: 24ch;
  text-wrap: balance;
}
.head-note { max-width: 46ch; font-size: 14px; color: var(--muted); text-align: right; }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 26px;
  padding: 0 11px 0 10px;
  border: 1px solid var(--muted-line);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1;
  color: var(--ink-2);
  white-space: nowrap;
}
.tag::before {
  content: '';
  flex: none;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--ink-2);
}
.tag[data-kind="audience"] { border-color: var(--accent-line); color: var(--accent); }
.tag[data-kind="audience"]::before { background: transparent; border: 1.5px solid var(--accent); }

/* ================================================================ owner chips (shape + name, not colour alone) */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 25px;
  padding: 0 10px 0 8px;
  border: 1px solid var(--muted-line);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  color: var(--ink);
}
.chip::before, .chip-dot::before,
.chip[data-owner="both"]::after, .chip-dot[data-owner="both"]::after {
  content: '';
  flex: none;
  width: 8px; height: 8px;
  border-radius: 50%;
}
.chip[data-owner="creator"] { border-color: var(--accent-line); background: var(--accent-tint); }
.chip[data-owner="creator"]::before, .chip-dot[data-owner="creator"]::before { background: var(--accent); }
.chip[data-owner="operator"]::before, .chip-dot[data-owner="operator"]::before { border: 1.5px solid var(--ink); }
.chip[data-owner="both"] { border-color: var(--accent-line); }
.chip[data-owner="both"]::before, .chip-dot[data-owner="both"]::before { order: -2; background: var(--accent); }
.chip[data-owner="both"]::after, .chip-dot[data-owner="both"]::after { order: -1; margin-left: -9px; border: 1.5px solid var(--ink); }
.chip[data-owner="both"]::after { margin-left: -10px; }
.chip-dot { display: inline-flex; align-items: center; gap: 4px; }

/* ================================================================ cover */

.screen-cover {
  display: flex;
  align-items: center;
  min-height: calc(100vh - var(--top-h) - var(--chrome-bottom));
}
.cover {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
  gap: 96px;
  align-items: center;
}
.cover-kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 40px; }
.monogram {
  width: 104px; height: 104px;
  display: grid;
  place-items: center;
  border: 2px solid var(--accent);
  border-radius: 24px;
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 800;
  letter-spacing: 0.01em;
}
.cover-name {
  margin-top: 16px;
  font-size: 76px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.035em;
  text-wrap: balance;
}
.cover-handle { margin-top: 16px; font-size: 18px; color: var(--muted); }
.cover-meta {
  margin-top: 40px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 15px;
}
.cover-by { font-weight: 500; }
.cover-when { color: var(--muted); }
.audit-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  margin-top: 10px;
  font-size: 13.5px;
  color: var(--ink-2);
  text-decoration: underline;
  text-decoration-color: var(--muted-line);
  text-underline-offset: 3px;
}
.audit-link:hover { color: var(--accent); text-decoration-color: currentColor; }

.contents-head {
  display: flex;
  justify-content: space-between;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line-strong);
}
.contents-link {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto 16px;
  align-items: center;
  gap: 16px;
  min-height: 62px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  text-decoration: none;
}
.contents-n { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.contents-title { font-size: 18px; font-weight: 500; line-height: 1.3; }
.contents-aud { font-size: 13px; color: var(--muted); white-space: nowrap; }
.contents-aud[data-kind="audience"] { color: var(--accent); }
.contents-link .icon { color: var(--muted); }
.contents-link:hover .contents-title, .contents-link:hover .icon { color: var(--accent); }
.contents-hint { margin-top: 16px; font-size: 13px; color: var(--muted); }

/* ================================================================ demand */

.stats { display: flex; flex: none; }
.stat { display: flex; flex-direction: column; justify-content: space-between; padding-left: 28px; margin-left: 28px; border-left: 1px solid var(--line); }
.stat:first-child { padding-left: 0; margin-left: 0; border-left: 0; }
.stat dt { font-size: 14px; line-height: 1.3; font-weight: 600; font-variant-caps: all-small-caps; letter-spacing: 0.09em; color: var(--muted); }
.stat dd { margin-top: 4px; font-size: 32px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

.posts-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 8px; }
.posts-key { font-size: 12.5px; color: var(--muted); }
.table-wrap { width: 100%; overflow-x: auto; }

.posts { width: 100%; border-top: 1px solid var(--line-strong); }
.posts th, .posts td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: middle;
  font-weight: 400;
}
.posts thead th {
  padding-top: 10px;
  padding-bottom: 9px;
  vertical-align: bottom;
  font-size: 14px;
  font-weight: 600;
  font-variant-caps: all-small-caps;
  letter-spacing: 0.09em;
  color: var(--muted);
  white-space: nowrap;
}
.posts thead th.key { color: var(--ink); }
.posts .num { text-align: right; }
.posts th.post { width: 38%; }
.post-title { display: block; font-size: 15px; font-weight: 600; line-height: 1.35; }
.post-sub { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
.hl-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
}
.hl-label::before { content: ''; width: 12px; height: 1.5px; background: currentColor; }

.bar-fig { display: inline-flex; align-items: center; justify-content: flex-end; gap: 14px; }
.mini-track {
  position: relative;
  display: block;
  width: 84px; height: 4px;
  border-radius: 2px;
  background: var(--track);
  overflow: hidden;
}
.mini-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--muted); }
.mini-track.is-key .mini-fill { background: var(--accent); }
.bar-fig .fig { min-width: 5ch; text-align: right; font-size: 15px; }
.posts td.key .fig { font-size: 17px; font-weight: 700; }
.posts td.intent { color: var(--muted); }
.posts td.intent[data-intent="high"] { color: var(--ink); font-weight: 600; }

.posts tr.is-highlight > th, .posts tr.is-highlight > td { background: var(--accent-tint); }
.posts tr.is-highlight > th { box-shadow: inset 3px 0 0 var(--accent); }
.posts tr.is-highlight td.key .fig { color: var(--accent); }
.posts tr.is-highlight .post-sub, .posts tr.is-highlight td.intent { color: var(--ink-2); }

.verdict {
  margin-top: 24px;
  max-width: 1040px;
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 600;
  line-height: 1.28;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.source-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.source-k { font-size: 13.5px; font-weight: 600; font-variant-caps: all-small-caps; letter-spacing: 0.09em; }

/* ================================================================ framed pages (offer, member area) */

.frame-intro { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 18px; font-size: 14px; color: var(--muted); }
.frame {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
}
.frame-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 38px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  background: var(--panel);
  font-size: 12.5px;
  color: var(--muted);
}
.frame-mark { width: 9px; height: 9px; border: 1.5px solid var(--muted); border-radius: 2px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 46px;
  padding: 0 20px;
  border: 1px solid transparent;
  border-radius: var(--r);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }

.disclaimer {
  margin-top: 28px;
  max-width: 96ch;
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink-2);
}

/* ---------------------------------------------------------------- offer */

.op { padding: 56px 64px 40px; }
.op-hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 248px;
  gap: 56px;
  align-items: end;
  padding-bottom: 48px;
  border-bottom: 1px solid var(--line);
}
.op-eyebrow { margin-bottom: 18px; font-size: 13.5px; font-weight: 600; letter-spacing: 0.02em; color: var(--accent); }
.op-title {
  font-size: 44px;
  font-weight: 800;
  line-height: 1.04;
  letter-spacing: -0.035em;
  text-wrap: balance;
}
.op-title-line { display: block; }
.op-sub { margin-top: 20px; max-width: 58ch; font-size: 18px; line-height: 1.55; color: var(--ink-2); }
/* Every item gets a leading dot; the list is pulled left by one dot's width and clipped,
   so a dot never shows at the start of a line. */
.op-format { display: flex; flex-wrap: wrap; align-items: center; row-gap: 4px; margin-top: 22px; margin-left: -23px; clip-path: inset(0 0 0 23px); font-size: 13.5px; color: var(--muted); }
.op-format li { display: inline-flex; align-items: center; }
.op-format li::before {
  content: '';
  width: 3px; height: 3px;
  margin: 0 10px;
  border-radius: 50%;
  background: currentColor;
}
.op-cta { margin-top: 30px; }
.op-glance { border-top: 1px solid var(--line-strong); }
.glance-row { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.glance-row dt { color: var(--muted); }
.glance-row dd { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

.op-sec { padding: 48px 0; border-bottom: 1px solid var(--line); }
.op-h2 { margin-bottom: 22px; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }

.problem-lines { margin-top: 12px; }
.problem-lines li {
  padding: 4px 0;
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 600;
  line-height: 1.22;
  letter-spacing: -0.025em;
}

.ba { display: grid; grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr); align-items: stretch; }
.ba-col { padding: 22px 24px; border: 1px solid var(--line); border-radius: var(--r); }
.ba-col p:last-child { margin-top: 8px; font-size: 18px; line-height: 1.45; }
.ba-after { border-color: var(--accent-line); background: var(--accent-tint); }
.ba-after .label { color: var(--ink-2); }
.ba-arrow { display: grid; place-items: center; color: var(--muted); }
.op-transform { margin-top: 32px; max-width: 74ch; }
.op-transform p:last-child { margin-top: 8px; font-size: 17px; line-height: 1.6; color: var(--ink-2); }

.wk-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid var(--line);
  border-left: 1px solid var(--line);
}
.wk-card { padding: 20px 20px 22px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.wk-card-n { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em; color: var(--accent); }
.wk-card h3 { margin: 10px 0 8px; font-size: 16px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
.wk-card p { font-size: 13.5px; line-height: 1.5; color: var(--muted); }

.fit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 64px; }
.op-list li { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.45; }
.op-list li:first-child { border-top: 1px solid var(--line); }
.op-list .icon { margin-top: 3px; }
.op-list-yes .icon { color: var(--positive); }
.op-list-no .icon { color: var(--muted); }

.price-block { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 56px; align-items: center; }
.price { margin-top: 6px; font-size: 60px; font-weight: 700; line-height: 1; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
.price-terms { border-top: 1px solid var(--line); }
.price-terms li { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; font-variant-numeric: tabular-nums; }

.faq details { border-bottom: 1px solid var(--line); }
.faq details:first-child { border-top: 1px solid var(--line); }
.faq summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  min-height: 56px;
  padding: 14px 0;
  list-style: none;
  cursor: pointer;
  font-size: 16px;
  font-weight: 600;
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary:hover { color: var(--accent); }
.faq-icon { position: relative; flex: none; width: 14px; height: 14px; color: var(--muted); }
.faq-icon::before, .faq-icon::after {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 1.5px;
  margin-top: -0.75px;
  background: currentColor;
}
.faq-icon::after { transform: rotate(90deg); transition: transform 150ms ease-out; }
.faq details[open] .faq-icon::after { transform: rotate(0deg); }
.faq-a p { max-width: 72ch; padding: 0 0 18px; line-height: 1.6; color: var(--ink-2); }

.op-join { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr); gap: 56px; align-items: start; }
.bonus { padding: 20px 22px; border: 1px solid var(--line-strong); border-radius: var(--r); }
.bonus p:last-child { margin-top: 8px; font-size: 16px; line-height: 1.5; }
.wl .op-h2 { margin-bottom: 6px; }
.wl-intro { margin-bottom: 18px; color: var(--muted); }
.wl-form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 12px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; }
.field-input {
  width: 100%;
  height: 46px;
  padding: 0 12px;
  border: 1px solid var(--muted);
  border-radius: var(--r);
  background: var(--field);
  font-size: 15px;
}
.field-input:hover { border-color: var(--ink); }
.wl-note {
  margin-top: 14px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--positive);
  border-radius: 0 var(--r) var(--r) 0;
  background: var(--positive-tint);
  font-size: 14px;
}

/* ---------------------------------------------------------------- inside (member area) */

.m-grid { display: grid; grid-template-columns: 272px minmax(0, 1fr); }
.m-side { padding: 24px 0 28px; border-right: 1px solid var(--line); background: var(--panel); border-radius: 0 0 0 var(--r-lg); }
.m-prog { padding: 0 20px; font-family: var(--font-display); font-size: 15px; font-weight: 700; line-height: 1.3; }
.m-side > .label { padding: 0 20px; margin: 6px 0 14px; }
.wk {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  gap: 12px;
  padding: 10px 20px 10px 18px;
  border-left: 2px solid transparent;
}
.wk.is-current { border-left-color: var(--accent); background: var(--accent-tint); }
.wk-mark {
  width: 24px; height: 24px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.wk.is-current .wk-mark { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.wk-title { display: block; font-size: 14px; font-weight: 600; line-height: 1.35; }
.wk.is-locked .wk-title { color: var(--ink-2); }
.wk-status { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wk.is-current .wk-status { color: var(--accent); }

.m-main { padding: 28px 36px 32px; min-width: 0; }
.m-week-title { margin-top: 6px; font-size: 30px; font-weight: 700; letter-spacing: -0.025em; }
.m-outcome { margin-top: 6px; font-size: 16px; color: var(--ink-2); }
.m-cols { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 24px; margin-top: 24px; align-items: start; }
.m-col-a, .m-col-b { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.lesson-frame {
  aspect-ratio: 16 / 9;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: color-mix(in srgb, var(--ground) 72%, var(--surface));
  color: var(--ink-2);
}
.lesson-rec { font-size: 14px; color: var(--muted); }
.lesson-cap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-top: 10px; font-size: 14.5px; }
.lesson-k { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.lesson-title { font-weight: 600; }

.card { padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--r); }
.card-title { margin-top: 2px; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.card.info p { margin-top: 6px; font-size: 14px; line-height: 1.5; color: var(--ink-2); }
.card.action { border-color: var(--line-strong); }
.action-text { margin-top: 6px; font-size: 16px; font-weight: 600; line-height: 1.4; }

.ws { padding-bottom: 8px; }
.ws-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
.ws-head .card-title { font-size: 18px; }
.ws-progress-text { font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.ws-count { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.ws-intro { margin-top: 10px; font-size: 14px; line-height: 1.5; color: var(--ink-2); }
.progress { height: 6px; margin: 16px 0 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.progress-fill { display: block; height: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left center; transition: transform 150ms ease-out; }
.ws-row + .ws-row { border-top: 1px solid var(--line); }
.ws-item { display: flex; align-items: flex-start; gap: 14px; min-height: 44px; padding: 10px 0; cursor: pointer; }
.ws-text { min-width: 0; }
.ws-label { display: block; font-size: 14.5px; font-weight: 600; line-height: 1.35; }
.ws-check { display: block; margin-top: 1px; font-size: 13px; line-height: 1.4; color: var(--muted); }
.ws-row.is-done .ws-label { color: var(--ink-2); }

.check {
  -webkit-appearance: none;
  appearance: none;
  flex: none;
  display: grid;
  place-content: center;
  width: 20px; height: 20px;
  margin: 0;
  border: 1.5px solid var(--muted);
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
}
.check::before {
  content: '';
  width: 10px; height: 5px;
  border-left: 2px solid var(--accent-ink);
  border-bottom: 2px solid var(--accent-ink);
  transform: translateY(-1px) rotate(-45deg) scale(0);
}
.check:checked { border-color: var(--accent); background: var(--accent); }
.check:checked::before { transform: translateY(-1px) rotate(-45deg) scale(1); }
.check:hover { border-color: var(--ink); }

/* ================================================================ numbers */

.n-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6.3fr); align-items: start; }
.n-left { padding-right: 52px; min-width: 0; }
.n-right { padding-left: 52px; border-left: 1px solid var(--line); min-width: 0; }
.screen-numbers .screen-head { margin-bottom: 22px; }

.scn-group { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(min-content, 1fr); border: 1px solid var(--muted); border-radius: var(--r); }
.scn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
  min-height: 56px;
  padding: 9px 14px;
  border: 0;
  border-left: 1px solid var(--line);
  background: transparent;
  text-align: left;
}
.scn:first-child { border-left: 0; border-radius: var(--r) 0 0 var(--r); }
.scn:last-child { border-radius: 0 var(--r) var(--r) 0; }
.scn:only-child { border-radius: var(--r); }
.scn-label { font-size: 14px; font-weight: 600; line-height: 1.3; }
.scn-seats { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.scn:hover { background: var(--accent-tint); }
.scn[aria-pressed="true"] { background: var(--surface); box-shadow: inset 0 -2px 0 var(--accent); }
.scn[aria-pressed="true"] .scn-seats { color: var(--accent); font-weight: 600; }

.seats-ctl { margin-top: 22px; }
.seats-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.seats-k { font-size: 14px; font-weight: 600; font-variant-caps: all-small-caps; letter-spacing: 0.09em; color: var(--muted); }
.seats-out { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.slider { position: relative; height: 44px; margin-top: 2px; }
.slider-track {
  position: absolute;
  left: 10px; right: 10px; top: 50%;
  height: 4px;
  margin-top: -2px;
  border-radius: 2px;
  background: color-mix(in srgb, var(--muted) 75%, transparent);
}
.slider-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--accent); }
.range {
  -webkit-appearance: none;
  appearance: none;
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: 44px;
  margin: 0;
  background: transparent;
  cursor: pointer;
  border-radius: var(--r-sm);
}
.range::-webkit-slider-runnable-track { height: 44px; background: transparent; border: 0; }
.range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 22px; height: 22px;
  margin-top: 11px;
  border: 4px solid var(--ground);
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 1.5px var(--accent);
}
.range::-moz-range-track { height: 44px; background: transparent; border: 0; }
.range::-moz-range-thumb {
  width: 14px; height: 14px;
  border: 4px solid var(--ground);
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 1.5px var(--accent);
}
.ticks { position: relative; height: 22px; }
.tick {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.tick::before { content: ''; width: 1px; height: 6px; margin-bottom: 4px; background: currentColor; opacity: 0.8; }
.tick.is-on { color: var(--accent); }

.est-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
.est {
  flex: none;
  display: inline-flex;
  align-items: center;
  height: 26px;
  padding: 0 9px;
  border: 1px solid var(--accent-line);
  border-radius: var(--r-sm);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.05em;
  line-height: 1;
  color: var(--accent);
}
.est-cap { font-size: 13.5px; color: var(--muted); }

.fig-block { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line-strong); container-type: inline-size; }
/* --len is the character count of the figure, so a seven-figure total still fits its column. */
.big-fig {
  --fig-max: clamp(56px, 7vw, 100px);
  margin-top: 10px;
  font-family: var(--font-body);
  font-size: min(var(--fig-max), calc(100cqi / (var(--len, 7) * 0.64)));
  font-weight: 700;
  line-height: 0.95;
  letter-spacing: -0.045em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.fig-basis { margin-top: 10px; font-size: 14.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* Creator's share under the big figure; the slot keeps its height whether or not the split is set. */
.fig-share {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  min-height: 74px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.fs-head { display: flex; align-items: center; gap: 10px; }
.fs-k { font-size: 14.5px; font-weight: 600; color: var(--ink-2); }
.fig-share.is-agree .fs-k { font-size: 16px; font-weight: 500; color: var(--muted); }
.fs-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
.fs-val { font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fs-basis { font-size: 14px; color: var(--ink-2); }

.assume { width: 100%; margin-top: 12px; font-size: 14px; }
.assume th, .assume td { padding: 8px 0; border-top: 1px solid var(--line); text-align: left; vertical-align: baseline; font-weight: 400; }
.assume tr:last-child th, .assume tr:last-child td { border-bottom: 1px solid var(--line); }
.assume th { width: 36%; padding-right: 12px; font-weight: 500; }
.as-basis { color: var(--muted); font-variant-numeric: tabular-nums; }
.assume td.as-val { text-align: right; white-space: nowrap; font-weight: 600; font-variant-numeric: tabular-nums; }
.eq { display: inline-block; width: 1.2em; text-align: left; font-weight: 400; color: var(--muted); }
.assume td.as-val .fig { display: inline-block; min-width: 6.5ch; text-align: right; }

.wf-block .est-head { margin-bottom: 12px; }
.wf-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.wf { width: 100%; table-layout: fixed; }
.wf thead th {
  padding: 0 0 8px;
  border-bottom: 1px solid var(--line-strong);
  text-align: left;
  font-size: 14px;
  font-weight: 600;
  font-variant-caps: all-small-caps;
  letter-spacing: 0.09em;
  color: var(--muted);
}
.wf th.wf-item { width: 42%; }
.wf th.wf-amt, .wf td.wf-amt { width: 112px; text-align: right; }
.wf tbody th, .wf tbody td { padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: middle; font-weight: 400; text-align: left; }
.wf-op { display: inline-block; width: 20px; vertical-align: top; font-family: var(--font-mono); font-size: 14px; line-height: 1.45; color: var(--muted); }
.wf-text { display: inline-block; width: calc(100% - 24px); vertical-align: top; }
.wf-label { display: block; font-size: 14.5px; font-weight: 500; line-height: 1.35; }
.wf-basis { display: block; margin-top: 1px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wf td.wf-lane { padding-left: 18px; padding-right: 18px; }
.wf-track { position: relative; display: block; height: 12px; }
.wf-track::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.wf-bar { position: absolute; top: 1px; bottom: 1px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 58%, transparent); }
.is-deduction .wf-bar { background: color-mix(in srgb, var(--muted) 60%, transparent); }
.is-net .wf-bar { background: var(--ink); }
.is-creator .wf-bar { background: var(--accent); }
.is-operator .wf-bar { background: color-mix(in srgb, var(--muted) 80%, transparent); }
/* Rates still to confirm: no placeholder box, just the baseline. A split still to agree: a filled neutral bar. */
.is-deduction .wf-bar.is-open { display: none; }
.wf-bar.is-open { top: 1px; bottom: 1px; background: color-mix(in srgb, var(--muted) 36%, transparent); }
.wf-val { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wf .is-net > * { border-top: 2px solid var(--line-strong); }
.wf .is-net .wf-label { font-weight: 700; }
.wf .is-net .wf-val { font-size: 18px; font-weight: 700; }
.wf .is-creator:not(.is-pending) .wf-val { color: var(--accent); }
.wf .is-pending .wf-val { font-size: 13.5px; font-weight: 500; color: var(--muted); }
.wf .is-pending .wf-label { color: var(--ink-2); }

.share-ctl {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr);
  align-items: center;
  gap: 0 14px;
  margin-top: 14px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r);
}
.share-k { font-size: 14px; font-weight: 600; }
.share-field { display: inline-flex; align-items: center; gap: 6px; }
.share-input {
  width: 76px;
  height: 40px;
  padding: 0 10px;
  border: 1px solid var(--muted);
  border-radius: var(--r-sm);
  background: var(--field);
  font-size: 16px;
  font-weight: 600;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.share-input:hover { border-color: var(--ink); }
.share-input[aria-invalid="true"] { border-color: var(--accent); }
.share-pct { color: var(--muted); font-weight: 600; }
.share-help { font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.share-error { grid-column: 1 / -1; font-size: 13px; font-weight: 600; color: var(--accent); }
.share-error-text { display: block; margin-top: 6px; }

.null-note {
  margin-top: 14px;
  padding-left: 12px;
  border-left: 2px solid var(--muted-line);
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink-2);
}
.split-basis { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.split-k { font-weight: 600; font-variant-caps: all-small-caps; letter-spacing: 0.09em; }

.switch {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  min-height: 44px;
  margin-top: 14px;
  padding: 0 4px 0 0;
  border: 0;
  border-radius: var(--r);
  background: none;
  font-size: 14px;
  font-weight: 600;
}
.switch-track {
  position: relative;
  flex: none;
  width: 36px; height: 20px;
  border: 1.5px solid var(--muted);
  border-radius: 999px;
}
.switch-knob {
  position: absolute;
  top: 2.5px; left: 2.5px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform 150ms ease-out;
}
.switch[aria-pressed="true"] .switch-track { border-color: var(--accent); background: var(--accent); }
.switch[aria-pressed="true"] .switch-knob { transform: translateX(16px); background: var(--accent-ink); }
.switch:hover .switch-label { color: var(--accent); }

.ladder { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line-strong); }
.ladder-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 24px; }
.ladder-sub { font-size: 13px; color: var(--muted); }
.ladder-warning {
  margin-top: 16px;
  padding: 12px 16px;
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--r) var(--r) 0;
  background: var(--accent-tint);
  font-size: 16px;
  font-weight: 600;
  line-height: 1.45;
}
.ld { width: 100%; margin-top: 12px; font-size: 14px; }
.ld th, .ld td { padding: 12px 20px 12px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-weight: 400; }
.ld th:last-child, .ld td:last-child { padding-right: 0; }
.ld thead th {
  padding-top: 0;
  padding-bottom: 8px;
  border-bottom-color: var(--line-strong);
  font-size: 14px;
  font-weight: 600;
  font-variant-caps: all-small-caps;
  letter-spacing: 0.09em;
  color: var(--muted);
}
.ld .num { text-align: right; }
.ld-val { display: block; }
.ld-name, .ld-main { display: block; font-weight: 600; }
.ld-main { font-variant-numeric: tabular-nums; }
.ld-sub { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ld-offer .ld-sub { font-variant-numeric: normal; }
.ld-note { max-width: 40ch; color: var(--ink-2); }

/* ================================================================ plan */

.time-callout {
  flex: 0 1 420px;
  padding: 12px 16px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r);

<script>/* Creator demo kit: the front-end. Vanilla JS, no dependencies, no network, no storage. */
(() => {
  'use strict';

  /* ================================================================ data */

  const dataEl = document.getElementById('creator-data');
  const D = JSON.parse((dataEl && dataEl.textContent) || '{}');

  const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
  const str = (v) => (v == null ? '' : String(v));
  const list = (v) => (Array.isArray(v) ? v : []);
  const obj = (v) => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});

  const C = obj(D.creator);
  const META = obj(D.meta);
  const EV = obj(D.evidence);
  const OFFER = obj(D.offer);
  const W1 = obj(D.week1);
  const LADDER = list(D.ladder).filter((o) => o && typeof o === 'object');
  const ECON = obj(D.economics);
  const LAUNCH = obj(D.launch);
  const ROLES = obj(D.roles);
  const FS = obj(D.firstStep);

  const LOCALE = str(C.locale) || 'en-GB';
  const CURRENCY = str(C.currency) || 'EUR';
  const NAME = str(C.displayName);
  const FIRST = str(C.firstName) || NAME.split(/\s+/)[0] || '';
  const HANDLE = str(C.handle).replace(/^@/, '');
  const COUNTRY = str(C.country).trim();
  const INITIALS = str(C.initials)
    || NAME.split(/\s+/).filter(Boolean).map((w) => w.charAt(0)).join('').slice(0, 3).toUpperCase();
  const OPERATOR = str(META.preparedBy).trim().split(/\s+/)[0] || 'Operator';

  /* ================================================================ formatting */

  const firstWorking = (make, tries) => {
    for (const t of tries) {
      try { return make(t[0], t[1]); } catch (e) { /* try the next option */ }
    }
    return make('en-GB', {});
  };
  const numberFormat = (opts) => firstWorking((l, o) => new Intl.NumberFormat(l, o), [[LOCALE, opts], ['en-GB', opts]]);
  const dateFormat = (opts) => firstWorking((l, o) => new Intl.DateTimeFormat(l, o), [[LOCALE, opts], ['en-GB', opts]]);

  const MONEY_BASE = { style: 'currency', currency: CURRENCY, maximumFractionDigits: 0, minimumFractionDigits: 0 };
  const MONEY = firstWorking((l, o) => new Intl.NumberFormat(l, o), [
    [LOCALE, Object.assign({ signDisplay: 'negative' }, MONEY_BASE)],
    [LOCALE, MONEY_BASE],
    ['en-GB', MONEY_BASE],
    ['en-GB', Object.assign({}, MONEY_BASE, { currency: 'EUR' })],
  ]);
  // Unit prices keep their cents (in the currency's own minor units); totals stay whole.
  const MINOR = (() => {
    try { return new Intl.NumberFormat('en', { style: 'currency', currency: CURRENCY }).resolvedOptions().maximumFractionDigits; } catch (e) { return 2; }
  })();
  const UNIT_BASE = Object.assign({}, MONEY_BASE, { minimumFractionDigits: MINOR, maximumFractionDigits: MINOR });
  const MONEY_UNIT = firstWorking((l, o) => new Intl.NumberFormat(l, o), [
    [LOCALE, Object.assign({ signDisplay: 'negative' }, UNIT_BASE)],
    [LOCALE, UNIT_BASE],
    ['en-GB', UNIT_BASE],
    ['en-GB', Object.assign({}, UNIT_BASE, { currency: 'EUR' })],
  ]);
  const NUM = numberFormat({});
  const PCT1 = numberFormat({ style: 'percent', minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const PCT = numberFormat({ style: 'percent', maximumFractionDigits: 3 });
  const DEC1 = numberFormat({ minimumFractionDigits: 1, maximumFractionDigits: 1 });

  const MINUS = '−';
  const DASH = '—';
  const withMinus = (fmt, n) => fmt.formatToParts(n).map((p) => (p.type === 'minusSign' ? MINUS : p.value)).join('');

  // Round half away from zero to whole currency units, after clearing binary noise (1500 × 2.9 / 100).
  const roundMoney = (x) => {
    if (!isNum(x)) return x;
    const a = Math.round(Number(Math.abs(x).toPrecision(12)));
    return x < 0 && a !== 0 ? -a : a;
  };
  const fmtMoney = (n) => (isNum(n) ? withMinus(MONEY, n) : DASH);
  const fmtUnit = (n) => {
    if (!isNum(n)) return DASH;
    const f = 10 ** MINOR;
    return Math.round(Number((Math.abs(n) * f).toPrecision(12))) % f === 0 ? fmtMoney(n) : withMinus(MONEY_UNIT, n);
  };
  const fmtNum = (n) => (isNum(n) ? withMinus(NUM, n) : DASH);
  const fmtPct = (x) => (isNum(x) ? withMinus(PCT1, x) : DASH); // 0.016 -> "1.6%"
  const fmtRate = (pct) => (isNum(pct) ? withMinus(PCT, pct / 100) : DASH); // 5 -> "5%", 30.5 -> "30.5%"
  const fmtDec1 = (n) => (isNum(n) ? withMinus(DEC1, n) : DASH);

  const parseISO = (iso) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str(iso).trim());
    return m ? new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12)) : null;
  };
  const DATE = dateFormat({ day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
  const DATE_SHORT = dateFormat({ day: 'numeric', month: 'short', timeZone: 'UTC' });
  const WEEKDAY = dateFormat({ weekday: 'short', timeZone: 'UTC' });
  const houseMonth = (parts) => parts.map((p) => (p.type === 'month' && p.value === 'Sept' ? 'Sep' : p.value)).join('');

  const fmtDate = (iso) => { const d = parseISO(iso); return d ? houseMonth(DATE.formatToParts(d)) : str(iso); };
  const fmtDay = (iso) => { const d = parseISO(iso); return d ? houseMonth(DATE_SHORT.formatToParts(d)) : str(iso); };
  const fmtWeekday = (iso) => { const d = parseISO(iso); return d ? WEEKDAY.format(d) : ''; };
  const fmtRange = (a, b) => (!b || a === b ? fmtDate(a) : `${fmtDate(a)} – ${fmtDate(b)}`);
  const dayIndex = (iso) => { const d = parseISO(iso); return d ? Math.floor(d.getTime() / 86400000) : null; };
  const isoFromIndex = (n) => new Date(n * 86400000 + 43200000).toISOString().slice(0, 10);
  const addDays = (iso, n) => { const i = dayIndex(iso); return i === null ? '' : isoFromIndex(i + n); };

  // Wraps each run of digits in a tabular-figures span, leaving the words (and their hyphens) as set.
  const figs = (text) => str(text).split(/([0-9](?:[0-9.,:]*[0-9])?)/).map((part, i) => (i % 2 ? h('span', { class: 'tnum' }, part) : part));
  const joinAnd = (items) => (items.length < 2 ? items.join('') : `${items.slice(0, -1).join(', ')} and ${items[items.length - 1]}`);
  const seatsLabel = (n) => `${fmtNum(n)} ${n === 1 ? 'seat' : 'seats'}`;
  const pad2 = (n) => String(n).padStart(2, '0');

  const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================================================================ DOM helpers */

  const SVG_NS = 'http://www.w3.org/2000/svg';

  function add(node, kids) {
    kids.forEach((k) => {
      if (k == null || k === false || k === '') return;
      if (Array.isArray(k)) add(node, k);
      else if (k instanceof Node) node.appendChild(k);
      else node.appendChild(document.createTextNode(String(k)));
    });
    return node;
  }

  function h(tag, attrs, ...kids) {
    const node = document.createElement(tag);
    Object.keys(attrs || {}).forEach((k) => {
      const v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') node.className = v;
      else if (k === 'hidden') node.hidden = true;
      else if (k === 'style') Object.keys(v).forEach((p) => node.style.setProperty(p, v[p]));
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : String(v));
    });
    return add(node, kids);
  }

  function svgEl(tag, attrs) {
    const n = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs).forEach((k) => n.setAttribute(k, attrs[k]));
    return n;
  }

  const ICONS = {
    left: ['M9.5 3.5 5 8l4.5 4.5'],
    right: ['M6.5 3.5 11 8l-4.5 4.5'],
    arrow: ['M2.75 8h10.5', 'M9.25 4 13.25 8l-4 4'],
    external: ['M6.5 4.25h5.25v5.25', 'M11.5 4.5 4.25 11.75'],
    lock: ['M4.75 7.25h6.5a1 1 0 0 1 1 1v4.5a1 1 0 0 1-1 1h-6.5a1 1 0 0 1-1-1v-4.5a1 1 0 0 1 1-1Z', 'M5.75 7.25V5.5a2.25 2.25 0 0 1 4.5 0v1.75'],
    check: ['M3.25 8.5 6.5 11.5 12.75 4.75'],
    cross: ['M4.75 4.75l6.5 6.5', 'M11.25 4.75l-6.5 6.5'],
  };

  function icon(name, size) {
    const px = String(size || 16);
    const s = svgEl('svg', {
      viewBox: '0 0 16 16', width: px, height: px, fill: 'none', stroke: 'currentColor', 'stroke-width': '1.5',
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true', focusable: 'false', class: `icon icon-${name}`,
    });
    (ICONS[name] || []).forEach((d) => s.appendChild(svgEl('path', { d })));
    return s;
  }

  function playGlyph() {
    const s = svgEl('svg', { viewBox: '0 0 56 56', width: '56', height: '56', 'aria-hidden': 'true', focusable: 'false', class: 'play' });
    s.appendChild(svgEl('circle', { cx: '28', cy: '28', r: '27', fill: 'none', stroke: 'currentColor', 'stroke-width': '1.5' }));
    s.appendChild(svgEl('path', { d: 'M23.5 19.5v17L37 28Z', fill: 'currentColor' }));
    return s;
  }

  /* ================================================================ screens */

  const SCREENS = [
    { id: 'cover', name: 'Cover', tag: 'For you', kind: 'creator' },
    { id: 'demand', name: 'What your audience is already asking for', tag: 'For you', kind: 'creator' },
    { id: 'offer', name: 'Your programme page', tag: 'What your followers see', kind: 'audience' },
    { id: 'inside', name: 'Inside the programme', tag: 'What members get', kind: 'audience' },
    { id: 'numbers', name: 'The numbers', tag: 'For you', kind: 'creator' },
    { id: 'plan', name: 'Who does what, and when', tag: 'For you', kind: 'creator' },
    { id: 'first-step', name: 'The first step', tag: 'For you', kind: 'creator' },
  ];
  const IDS = SCREENS.map((s) => s.id);
  const byId = (id) => SCREENS[IDS.indexOf(id)];
  let fitSlides = () => {}; // set by renderFirstStep; needs the carousel on screen to measure

  const audienceTag = (def) => h('span', { class: 'tag', 'data-testid': 'audience-tag', 'data-kind': def.kind }, def.tag);

  const heading = (def, text, cls) => h('h1', { id: `h-${def.id}`, class: cls || 'screen-title', tabindex: '-1' }, text);

  const screenHead = (def, title, aside) => h('header', { class: `screen-head${aside ? ' has-aside' : ''}` },
    h('div', { class: 'screen-head-main' }, audienceTag(def), heading(def, title)),
    aside || null);

  const screen = (def, ...content) => h('section', {
    class: `screen screen-${def.id}`, 'data-screen': def.id, 'aria-labelledby': `h-${def.id}`, hidden: true,
  }, ...content);

  const label = (text, extra) => h('p', { class: `label${extra ? ` ${extra}` : ''}` }, text);

  const ownerKind = (owner) => {
    const o = str(owner).trim();
    if (o === FIRST) return 'creator';
    if (/^both$/i.test(o)) return 'both';
    return 'operator';
  };
  // Only launch phases carry data-testid="owner"; other chips share the look without the hook.
  const chip = (owner, testid) => h('span', {
    class: 'chip', 'data-owner': ownerKind(owner), 'data-testid': testid ? 'owner' : null,
  }, str(owner).trim() || OPERATOR);

  /* ---------------------------------------------------------------- cover */

  function renderCover(def) {
    const audit = str(META.auditUrl);
    const auditLink = /^https?:\/\//i.test(audit)
      ? h('a', { class: 'audit-link', href: audit, target: '_blank', rel: 'noopener' }, 'Built from your monetisation audit', icon('external', 14))
      : null;

    const identity = h('div', { class: 'cover-id' },
      h('div', { class: 'monogram', 'data-testid': 'avatar', role: 'img', 'aria-label': `Initials ${INITIALS}` }, INITIALS),
      h('div', { class: 'cover-kicker' }, audienceTag(def), label('Programme concept', 'label-accent')),
      heading(def, NAME, 'cover-name'),
      HANDLE || COUNTRY ? h('p', { class: 'cover-handle' }, [HANDLE ? `@${HANDLE}` : '', COUNTRY].filter(Boolean).join(' · ')) : null,
      h('div', { class: 'cover-meta' },
        h('p', { class: 'cover-by', 'data-testid': 'prepared-by' }, `Prepared by ${str(META.preparedBy)}`),
        h('p', { class: 'cover-when' }, h('time', { 'data-testid': 'cover-date', datetime: str(META.date) }, fmtDate(META.date))),
        auditLink));

    const contents = h('nav', { class: 'cover-contents', 'aria-label': 'Contents' },
      h('div', { class: 'contents-head' }, label('Contents'), label('Who it is for')),
      h('ol', { class: 'contents', 'data-testid': 'contents' },
        SCREENS.slice(1).map((s, i) => h('li', null,
          h('a', { class: 'contents-link', href: `#${s.id}` },
            h('span', { class: 'contents-n' }, pad2(i + 1)),
            h('span', { class: 'contents-title' }, s.name),
            h('span', { class: 'contents-aud', 'data-kind': s.kind }, s.tag),
            icon('arrow', 16))))),
      h('p', { class: 'contents-hint' }, 'Use the arrow keys, or Next, to move through the screens.'));

    return screen(def, h('div', { class: 'cover' }, identity, contents));
  }

  /* ---------------------------------------------------------------- demand */

  function renderDemand(def) {
    const posts = list(EV.topPosts).map(obj);
    const val = (v) => (isNum(v) ? v : 0);
    const ratio = (p) => (val(p.likes) > 0 ? val(p.comments) / val(p.likes) : (val(p.comments) > 0 ? Infinity : 0));
    let best = posts.length ? 0 : -1;
    posts.forEach((p, i) => { if (ratio(p) > ratio(posts[best])) best = i; });
    const maxLikes = Math.max(0, ...posts.map((p) => val(p.likes)));
    const maxComments = Math.max(0, ...posts.map((p) => val(p.comments)));

    const stat = (k, v) => h('div', { class: 'stat', 'data-testid': 'stat' }, h('dt', null, k), h('dd', null, v));
    const stats = h('dl', { class: 'stats' },
      stat('Followers', fmtNum(EV.followers)),
      stat('Engagement rate', isNum(EV.engagementRatePct) ? fmtPct(EV.engagementRatePct / 100) : DASH),
      stat('Average comments', fmtNum(EV.avgComments)));

    const barFig = (v, max, key) => h('span', { class: 'bar-fig' },
      h('span', { class: `mini-track${key ? ' is-key' : ''}`, 'aria-hidden': 'true' },
        h('span', { class: 'mini-fill', style: { width: `${max > 0 ? ((val(v) / max) * 100).toFixed(2) : 0}%` } })),
      h('span', { class: 'fig' }, fmtNum(v)));

    const rows = posts.map((p, i) => {
      const hi = i === best && posts.length > 0;
      const r = ratio(p);
      const sub = [str(p.theme), isNum(p.views) ? `${fmtNum(p.views)} views` : ''].filter(Boolean).join(' · ');

  // Operator share as typed: "30", "30%", "30.5", "30,5", ".5", "30.", "0030". ASCII digits only.
  // "3,000" and "1,000.5" are read as grouped thousands (so out of range), never as 3 or 1.
  // In a locale whose decimal mark is a comma (de-DE), "12,345" is 12.345 and "1.000" is a thousand.
  // A lone "." or "," is someone mid-typing: no error until they leave the field.
  const DECIMAL_MARK = (() => {
    try { return (new Intl.NumberFormat(LOCALE).formatToParts(1.5).find((p) => p.type === 'decimal') || {}).value || '.'; } catch (e) { return '.'; }
  })();
  function parseShare(raw) {
    const BAD = { value: null, error: true, partial: false };
    const s = str(raw).trim();
    if (!s) return { value: null, error: false, partial: false };
    const m = /^([0-9.,]*)\s*(%?)$/.exec(s);
    if (!m) return BAD;
    const body = m[1];
    if (!/[0-9]/.test(body)) return (body === '.' || body === ',') && !m[2] ? { value: null, error: false, partial: true } : BAD;
    const grouped = (sep) => new RegExp(`^[1-9][0-9]{0,2}(?:\\${sep}[0-9]{3})+$`);
    const dots = body.split('.').length - 1;
    const commas = body.split(',').length - 1;
    let plain = null;
    if (dots && commas) {
      const dec = body.lastIndexOf('.') > body.lastIndexOf(',') ? '.' : ',';
      const grp = dec === '.' ? ',' : '.';
      const parts = body.split(dec);
      if (parts.length !== 2 || !grouped(grp).test(parts[0])) return BAD;
      plain = `${parts[0].split(grp).join('')}.${parts[1]}`;
    } else if (commas) {
      if (DECIMAL_MARK === ',' && commas === 1) plain = body.replace(',', '.');
      else if (grouped(',').test(body)) plain = body.split(',').join('');
      else if (commas === 1) plain = body.replace(',', '.');
      else return BAD;
    } else if (dots) {
      if (DECIMAL_MARK === ',' && grouped('.').test(body)) plain = body.split('.').join('');
      else if (dots === 1) plain = body;
      else if (grouped('.').test(body)) plain = body.split('.').join('');
      else return BAD;
    } else {
      plain = body;
    }
    const v = Number(plain);
    if (!Number.isFinite(v) || v < 0 || v > 100) return BAD;
    return { value: v, error: false, partial: false };
  }
