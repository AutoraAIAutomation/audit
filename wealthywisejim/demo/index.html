      const basis = h('span', { class: 'wf-basis' });
      const barEl = h('span', { class: 'wf-bar' });
      const value = h('span', { class: 'wf-val', 'data-testid': `wf-${key}` });
      const tr = h('tr', { class: `wf-row ${cls || ''}`.trim(), 'data-row': key },
        h('th', { scope: 'row', class: 'wf-item' },
          h('span', { class: 'wf-op', 'aria-hidden': 'true' }, op),
          h('span', { class: 'wf-text' }, h('span', { class: 'wf-label' }, text), basis)),
        h('td', { class: 'wf-lane' }, h('span', { class: 'wf-track', 'aria-hidden': 'true' }, barEl)),
        h('td', { class: 'wf-amt' }, value));
      rows[key] = { tr, basis, barEl, value };
      return tr;
    };

    const shareIn = h('input', {
      id: 'operator-share', class: 'share-input', type: 'text', inputmode: 'decimal', autocomplete: 'off', spellcheck: 'false',
      'data-testid': 'operator-share', 'aria-describedby': 'share-help share-error',
      value: isNum(ECON.operatorSharePct) ? String(ECON.operatorSharePct) : '',
    });
    // The status region stays in place; only the message inside it appears and disappears, so it is announced.
    const shareErrText = h('span', { class: 'share-error-text', 'data-testid': 'operator-share-error', hidden: true }, 'Enter a number from 0 to 100, or leave it blank.');
    const shareErr = h('p', { id: 'share-error', class: 'share-error', role: 'status' }, shareErrText);

    const nullNote = h('p', { class: 'null-note', 'data-testid': 'null-note', hidden: pending.length === 0 },
      pending.length ? `To confirm: ${joinAnd(pending.map((d) => d.note))}. ${pending.length > 1 ? 'They are' : 'It is'} left out of the maths, so net is shown before ${pending.length > 1 ? 'them' : 'it'}.` : '');

    const toggle = h('button', {
      type: 'button', class: 'switch', 'data-testid': 'ladder-toggle', 'aria-pressed': 'false', 'aria-controls': 'ladder', hidden: LADDER.length === 0,
    }, h('span', { class: 'switch-track', 'aria-hidden': 'true' }, h('span', { class: 'switch-knob' })), h('span', { class: 'switch-label' }, 'Show the full ladder'));

    const right = h('div', { class: 'n-right' },
      h('section', { class: 'estimate wf-block', 'aria-labelledby': 'wf-title' },
        h('div', { class: 'est-head' }, ' ', h('span', { class: 'est' }, 'Estimate'), ' ', h('h2', { id: 'wf-title', class: 'wf-title' }, 'Gross to net, then the split')),
        h('table', { class: 'wf' },
          h('caption', { class: 'sr-only' }, 'Estimate: gross to net, then the split'),
          h('thead', null, h('tr', null,
            h('th', { scope: 'col', class: 'wf-item' }, 'Item'),
            h('th', { scope: 'col', class: 'wf-lane' }, h('span', { class: 'sr-only' }, 'Scale')),
            h('th', { scope: 'col', class: 'wf-amt' }, 'Amount'))),
          h('tbody', null,
            wfRow('gross', '', 'Gross', 'is-gross'),
            DED.map((d) => wfRow(d.key, MINUS, d.label, 'is-deduction')),
            wfRow('net', '=', 'Net', 'is-net'),
            wfRow('creator', '', `Creator share (${FIRST})`, 'is-split is-creator'),
            wfRow('operator', '', `Operator share (${OPERATOR})`, 'is-split is-operator'))),
        h('div', { class: 'share-ctl' },
          h('label', { for: 'operator-share', class: 'share-k' }, `Operator share (${OPERATOR})`),
          h('span', { class: 'share-field' }, shareIn, h('span', { class: 'share-pct', 'aria-hidden': 'true' }, '%')),
          h('p', { id: 'share-help', class: 'share-help' }, 'This session only, not saved. Blank = to agree.'),
          shareErr),
        nullNote,
        ECON.splitBasis ? h('p', { class: 'split-basis' }, h('span', { class: 'split-k' }, 'Split basis'), h('span', null, str(ECON.splitBasis))) : null),
      toggle);

    /* the ladder (never summed with the programme figure) */
    const ladderRows = LADDER.map((o) => {
      const p = isNum(o.price) ? o.price : null;
      const lo = isNum(o.buyersLow) ? o.buyersLow : null;
      const hi = isNum(o.buyersHigh) ? o.buyersHigh : null;
      const revLo = p !== null && lo !== null ? lo * p : null;
      const revHi = p !== null && hi !== null ? hi * p : null;
      // Each value and its sub-lines share one wrapper, so they stay together when the table stacks.
      return h('tr', { 'data-testid': 'ladder-row' },
        h('th', { scope: 'row', class: 'ld-offer' }, h('span', { class: 'ld-name' }, str(o.name)), o.format ? h('span', { class: 'ld-sub' }, str(o.format)) : null),
        h('td', { class: 'num', 'data-label': 'Price' }, h('span', { class: 'ld-val' }, h('span', { class: 'ld-main' }, fmtUnit(p)))),
        h('td', { class: 'num', 'data-label': 'Buyers' }, h('span', { class: 'ld-val' },
          h('span', { class: 'ld-main' }, fmtNum(lo)),
          hi !== null && lo !== null && hi !== lo ? h('span', { class: 'ld-sub' }, `range ${fmtNum(lo)}–${fmtNum(hi)}`) : null)),
        h('td', { class: 'num', 'data-label': 'Revenue estimate' }, h('span', { class: 'ld-val' },
          h('span', { class: 'ld-main' }, fmtMoney(revLo)),
          revHi !== null && revHi !== revLo ? h('span', { class: 'ld-sub' }, `range ${fmtMoney(revLo)}–${fmtMoney(revHi)}`) : null,
          lo !== null && p !== null ? h('span', { class: 'ld-sub' }, `${fmtNum(lo)} ${lo === 1 ? 'buyer' : 'buyers'} × ${fmtUnit(p)}`) : null)),
        h('td', { class: 'ld-note', 'data-label': 'Note' }, str(o.note)));
    });

    const ladder = h('section', { id: 'ladder', class: 'ladder estimate', 'data-testid': 'ladder', hidden: true, 'aria-labelledby': 'ladder-title' },
      h('div', { class: 'ladder-head' },
        h('div', { class: 'est-head' }, ' ', h('span', { class: 'est' }, 'Estimate'), ' ', h('h2', { id: 'ladder-title', class: 'wf-title' }, 'The full ladder')),
        h('p', { class: 'ladder-sub' }, 'Shown on its own, never added to the programme figure. Conservative case first.')),
      h('p', { class: 'ladder-warning', 'data-testid': 'ladder-warning' }, str(ECON.ladderWarning)),
      h('div', { class: 'table-wrap' },
        h('table', { class: 'ld' },
          h('caption', { class: 'sr-only' }, 'Estimate: the full ladder, one row per offer'),
          h('thead', null, h('tr', null,
            h('th', { scope: 'col' }, 'Offer'),
            h('th', { scope: 'col', class: 'num' }, 'Price'),
            h('th', { scope: 'col', class: 'num' }, 'Buyers'),
            h('th', { scope: 'col', class: 'num' }, 'Revenue estimate'),
            h('th', { scope: 'col' }, 'Note'))),
          h('tbody', null, ladderRows))));

    toggle.addEventListener('click', () => {
      const on = toggle.getAttribute('aria-pressed') !== 'true';
      toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
      ladder.hidden = !on;
      if (on) ladder.scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
    });

    /* render */
    const clamp01 = (x) => Math.max(0, Math.min(1, x));
    const place = (key, a, b, open) => {
      const el = rows[key].barEl;
      const lo = clamp01(Math.min(a, b));
      const hi = clamp01(Math.max(a, b));
      el.style.left = `${(lo * 100).toFixed(3)}%`;
      el.style.width = `${((hi - lo) * 100).toFixed(3)}%`;
      el.classList.toggle('is-open', !!open);
    };

    // Figures are computed unrounded (data-value keeps them raw). What is shown is rounded so the rows
    // visibly add up: each deduction to whole units, net = gross − those, operator rounded, creator = the rest.
    const update = (evt) => {
      const seats = state.seats;
      const share = parseShare(shareIn.value);
      const leaving = !!evt && evt.type === 'change';
      const showErr = share.error || (share.partial && leaving);
      shareErrText.hidden = !showErr;
      if (showErr) shareIn.setAttribute('aria-invalid', 'true'); else shareIn.removeAttribute('aria-invalid');
      const r = compute(seats, share.value);

      slider.setAttribute('aria-valuetext', seatsLabel(seats));
      seatsOut.textContent = `${fmtNum(seats)} of ${fmtNum(cap)} ${cap === 1 ? 'seat' : 'seats'}`;
      sliderFill.style.width = `${cap ? (seats / cap) * 100 : 0}%`;
      ticks.forEach((t) => t.classList.toggle('is-on', Number(t.getAttribute('data-seats')) === seats));
      scnBtns.forEach((b) => b.setAttribute('aria-pressed', Number(b.getAttribute('data-seats')) === seats ? 'true' : 'false'));

      const G = r.gross;
      const shown = { gross: roundMoney(G), deductions: r.deductions.map((v) => (v === null ? null : roundMoney(v))) };
      shown.net = shown.gross - shown.deductions.reduce((a, v) => a + (v || 0), 0);
      shown.operator = r.operator === null ? null : roundMoney((shown.net * share.value) / 100);
      shown.creator = shown.operator === null ? null : shown.net - shown.operator;

      const grossText = fmtMoney(shown.gross);
      setVal(grossEl, G, grossText);
      grossEl.style.setProperty('--len', String(Math.max(5, grossText.length)));
      grossBasis.textContent = `${seatsLabel(seats)} × ${fmtUnit(price)}`;
      setVal(convEl, r.conversion, r.conversion === null ? DASH : fmtPct(r.conversion));
      convBasis.textContent = engaged ? `${seatsLabel(seats)} ÷ ${fmtNum(engaged)}` : 'engaged audience to confirm';

      const frac = (v) => (G > 0 ? v / G : 0);
      setVal(rows.gross.value, G, grossText);
      rows.gross.basis.textContent = `${seatsLabel(seats)} × ${fmtUnit(price)}`;
      place('gross', 0, G > 0 ? 1 : 0);

      let running = G;
      DED.forEach((d, i) => {
        const row = rows[d.key];
        const amt = r.deductions[i];
        row.tr.classList.toggle('is-pending', amt === null);
        if (amt === null) {
          setVal(row.value, null, 'to confirm');
          row.basis.textContent = d.open;
          const end = G > 0 ? frac(running) : 1;
          place(d.key, end - 0.1, end, true);
        } else {
          setVal(row.value, -amt, fmtMoney(-shown.deductions[i]));
          row.basis.textContent = `${fmtRate(d.pct)} of gross`;
          place(d.key, frac(running - amt), frac(running));
          running -= amt;
        }
      });

      setVal(rows.net.value, r.net, fmtMoney(shown.net));
      rows.net.basis.textContent = pending.length ? 'before costs to confirm' : 'gross less the costs above';
      place('net', 0, frac(Math.max(0, r.net)));

      const netEnd = G > 0 ? frac(Math.max(0, r.net)) : 1;
      const agreed = r.operator !== null;
      const before = pending.length ? ', before costs to confirm' : '';
      rows.creator.tr.classList.toggle('is-pending', !agreed);
      rows.operator.tr.classList.toggle('is-pending', !agreed);
      shareSum.classList.toggle('is-agree', !agreed);
      if (agreed) {
        const creatorBasis = `${fmtRate(100 - share.value)} of net${before}`;
        setVal(rows.creator.value, r.creator, fmtMoney(shown.creator));
        setVal(rows.operator.value, r.operator, fmtMoney(shown.operator));
        rows.creator.basis.textContent = creatorBasis;
        rows.operator.basis.textContent = `${fmtRate(share.value)} of net${before}`;
        const split = G > 0 ? frac(Math.max(0, r.creator)) : 0;
        place('creator', 0, split);
        place('operator', split, netEnd);
        const val = h('span', { class: 'fs-val' }, fmtMoney(shown.creator));
        setVal(val, r.creator, fmtMoney(shown.creator));
        shareSum.replaceChildren(
          h('span', { class: 'fs-head' }, h('span', { class: 'est' }, 'Estimate'), ' ', h('span', { class: 'fs-k' }, creatorLabel)),
          ' ',
          h('span', { class: 'fs-line' }, val, ' ', h('span', { class: 'fs-basis' }, creatorBasis)));
      } else {
        setVal(rows.creator.value, null, 'to agree');
        setVal(rows.operator.value, null, 'to agree');
        rows.creator.basis.textContent = 'split to agree';
        rows.operator.basis.textContent = 'split to agree';
        place('creator', 0, netEnd, true);
        place('operator', 0, netEnd, true);
        shareSum.replaceChildren(h('span', { class: 'fs-k' }, `${creatorLabel} · to agree`));
      }
    };

    const setSeats = (n) => {
      state.seats = Math.max(0, Math.min(cap, Math.round(Number(n) || 0)));
      update();
    };
    slider.addEventListener('input', () => setSeats(slider.value));
    slider.addEventListener('change', () => setSeats(slider.value));
    scnBtns.forEach((b) => b.addEventListener('click', () => {
      slider.value = b.getAttribute('data-seats');
      setSeats(slider.value);
    }));
    shareIn.addEventListener('input', update);
    shareIn.addEventListener('change', update);
    update();

    return screen(def, h('div', { class: 'n-grid' }, left, right), ladder);
  }

  /* ---------------------------------------------------------------- plan */

  function renderPlan(def) {
    const col = (key, kind, kindText, title, items) => h('section', { class: `role role-${kind}`, 'data-testid': `roles-${key}`, 'aria-labelledby': `role-${key}` },
      h('p', { class: 'role-kind' }, h('span', { class: 'chip-dot', 'data-owner': kind, 'aria-hidden': 'true' }), kindText),
      h('h2', { id: `role-${key}`, class: 'role-name' }, title),
      h('ul', { class: 'role-list' }, list(items).map((t) => h('li', null, str(t)))));

    const time = h('div', { class: 'time-callout', hidden: !str(ROLES.creatorTime).trim() },
      h('p', { class: 'label' }, `${FIRST ? `${FIRST}’s` : 'Your'} time`),
      h('p', { class: 'time-text', 'data-testid': 'creator-time' }, figs(ROLES.creatorTime)));

    const phases = list(LAUNCH.phases).map(obj);
    const valid = phases.filter((p) => parseISO(p.start));
    const starts = valid.map((p) => dayIndex(p.start));
    const ends = valid.map((p) => (parseISO(p.end) ? dayIndex(p.end) : dayIndex(p.start)));
    const a0 = starts.length ? Math.min(...starts) : 0;
    const a1 = ends.length ? Math.max(...ends, a0) : 0;
    const span = Math.max(1, a1 - a0 + 1);
    const pos = (d) => `${(((d - a0) / span) * 100).toFixed(3)}%`;

    const mondays = [];
    for (let d = a0; valid.length && d <= a1; d += 1) if ((((d % 7) + 7) % 7) === 4) mondays.push(d);
    const axisLabels = [];
    if (valid.length) {
      if (!mondays.length || mondays[0] - a0 >= 3) axisLabels.push({ d: a0, edge: 'start' });
      mondays.forEach((d) => axisLabels.push({ d }));
      if (!mondays.length || a1 + 1 - mondays[mondays.length - 1] >= 5) axisLabels.push({ d: a1 + 1, edge: 'end', text: fmtDay(isoFromIndex(a1)) });
    }
    const gridLines = () => mondays.map((d) => h('span', { class: 'g-line', style: { left: pos(d) } }));

    // The header carries the year; a phase repeats it only when it falls in a different year.
    const yearOf = (iso) => str(iso).slice(0, 4);
    const headYear = valid.length && yearOf(isoFromIndex(a0)) === yearOf(isoFromIndex(a1)) ? yearOf(isoFromIndex(a0)) : null;
    const phaseRange = (s, e) => {
      const end = parseISO(e) ? e : s;
      if (!headYear || !parseISO(s) || yearOf(s) !== headYear || yearOf(end) !== headYear) return fmtRange(s, end);
      return s === end ? fmtDay(s) : `${fmtDay(s)} – ${fmtDay(end)}`;
    };

    const axis = h('div', { class: 'g-axis-row' },
      h('div', { class: 'g-axis-k' },
        h('h2', { id: 'tl-title', class: 'tl-title' }, 'Launch timeline'),
        valid.length ? h('p', { class: 'tl-range' }, fmtRange(isoFromIndex(a0), isoFromIndex(a1))) : null),
      valid.length ? h('div', { class: 'g-axis', 'aria-hidden': 'true' }, axisLabels.map((t) => h('span', {
        class: `g-tick${t.edge ? ` is-${t.edge}` : ''}`, style: { left: pos(t.d) },
      }, t.text || fmtDay(isoFromIndex(t.d))))) : null);

    const rowsEl = h('ol', { class: 'g-rows' }, phases.map((p, i) => {
      const s = dayIndex(p.start);
      const e = parseISO(p.end) ? dayIndex(p.end) : s;
      const kind = ownerKind(p.owner);
      return h('li', { class: 'g-row', 'data-testid': 'phase' },
        h('div', { class: 'g-info' },
          h('span', { class: 'g-n' }, String(isNum(p.n) ? p.n : i + 1)),
          h('div', { class: 'g-main' },
            h('p', { class: 'g-name' }, str(p.name)),
            h('p', { class: 'g-dates' }, phaseRange(p.start, p.end))),
          h('p', { class: 'g-what' }, str(p.what)),
          h('div', { class: 'g-owner' }, chip(p.owner, true))),
        h('div', { class: 'g-lane', 'aria-hidden': 'true' },
          gridLines(),
          s !== null ? h('span', { class: 'g-bar', 'data-owner': kind, style: { left: pos(s), width: `${(((e - s + 1) / span) * 100).toFixed(3)}%` } }) : null));
    }));

    const cohortOk = parseISO(LAUNCH.cohortStart);
    const alt = str(LAUNCH.altWindow);

    return screen(def,
      screenHead(def, 'Who does what, and when', time),
      h('div', { class: 'roles' },
        col('creator', 'creator', 'Creator', FIRST, ROLES.creator),
        col('operator', 'operator', 'Operator', OPERATOR, ROLES.operator),
        col('together', 'both', 'Shared', 'Together', ROLES.together)),
      h('section', { class: 'timeline', 'aria-labelledby': 'tl-title' },
        h('div', { class: 'gantt' }, axis, rowsEl),
        h('div', { class: 'tl-foot' },
          h('p', { class: 'cohort', 'data-testid': 'cohort' },
            cohortOk ? `Cohort · ${fmtRange(LAUNCH.cohortStart, parseISO(LAUNCH.cohortEnd) ? LAUNCH.cohortEnd : '')}` : 'Cohort · dates to agree'),
          h('p', { class: 'alt-line', hidden: !alt }, h('span', { class: 'alt-k' }, 'Alternative'), h('span', { 'data-testid': 'alt-window' }, alt)))));
  }

  /* ---------------------------------------------------------------- first step */

  function renderFirstStep(def) {
    const slides = list(FS.slides).map(str);
    const kw = str(FS.keyword).trim().toLowerCase();
    // One type scale for the whole carousel: the first line of a multi-line slide leads, and the line
    // carrying the reply keyword is the call to action, the strongest line on its slide.
    const slideText = (t) => {
      const lines = t.split('\n');
      const multi = lines.length > 1;
      const hasCta = !!kw && lines.some((line) => line.toLowerCase().indexOf(kw) >= 0);
      const p = h('p', { class: `slide-text${hasCta ? ' has-cta' : ''}` });
      lines.forEach((line, i) => {
        if (i > 0) p.appendChild(document.createTextNode('\n'));
        const cta = kw && line.toLowerCase().indexOf(kw) >= 0;
        p.appendChild(h('span', { class: cta ? 'slide-cta' : (multi ? (i === 0 ? 'slide-lead' : 'slide-rest') : 'slide-line') }, line));
      });
      return p;
    };
    const longest = Math.max(1, ...slides.map((t) => t.length));
    const k0 = Math.min(1.15, Math.sqrt(150 / longest));
    const slidesEl = h('ol', { class: 'slides', style: { '--n': String(Math.max(1, slides.length)), '--k': k0.toFixed(3) } }, slides.map((t, i) => h('li', { class: 'slide', 'data-testid': 'slide' },
      h('span', { class: 'slide-n' }, `${i + 1}/${slides.length}`),
      slideText(t),
      HANDLE ? h('span', { class: 'slide-handle' }, `@${HANDLE}`) : null)));
    // Shrink the shared scale until the fullest slide fits its square with a little air.
    const roomy = (li) => {
      const cs = getComputedStyle(li);
      const inner = li.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const kids = [...li.children];
      const used = kids.reduce((a, c) => a + c.offsetHeight, 0) + (kids.length - 1) * (parseFloat(cs.rowGap) || 0);
      return used <= inner * 0.94;
    };
    fitSlides = () => {
      if (!slidesEl.getClientRects().length) return;
      let k = k0;
      slidesEl.style.setProperty('--k', k.toFixed(3));
      const items = [...slidesEl.children];
      while (k > 0.5 && !items.every(roomy)) {
        k -= 0.025;
        slidesEl.style.setProperty('--k', k.toFixed(3));
      }
    };

    const goN = isNum(FS.goThreshold) ? FS.goThreshold : null;
    const fb = isNum(FS.fallbackThreshold) ? FS.fallbackThreshold : null;
    const band = (kind, tagText, when, then) => h('div', { class: `band band-${kind}` },
      h('span', { class: 'band-tag' }, tagText),
      h('p', { class: 'band-text' }, h('strong', { class: 'band-when' }, when), h('span', { class: 'band-arrow', 'aria-hidden': 'true' }, ' → '), h('span', { class: 'sr-only' }, ': '), figs(then)));
    const bands = [];
    if (goN !== null) bands.push(band('go', 'Go', `${fmtNum(goN)}+ replies`, 'open the waitlist'));
    if (goN !== null && fb !== null && goN - 1 >= fb) {
      bands.push(band('talk', 'Between', goN - 1 === fb ? `${fmtNum(fb)} replies` : `${fmtNum(fb)}–${fmtNum(goN - 1)} replies`, 'we talk it through'));
    }
    if (fb !== null) bands.push(band('fallback', 'Fallback', `under ${fmtNum(fb)} replies`, `run ${str(FS.fallbackOffer)} first`));

    const steps = list(FS.nextSteps).map(obj);
    const askStep = steps.find((s) => s.date === META.date) || steps[0] || null;
    const stepDate = (iso) => (parseISO(iso) ? `${fmtWeekday(iso)} ${fmtDate(iso)}` : str(iso));

    const ask = askStep ? h('section', { class: 'ask', 'data-testid': 'ask', 'aria-labelledby': 'ask-title' },
      h('div', { class: 'ask-main' },
        h('p', { class: 'ask-eyebrow' }, askStep.date === META.date ? 'The ask · today' : `The ask · ${stepDate(askStep.date)}`),
        h('h2', { id: 'ask-title', class: 'ask-text' }, str(askStep.what))),
      h('div', { class: 'ask-side' },
        h('p', { class: 'ask-date' }, stepDate(askStep.date)),
        chip(askStep.owner))) : null;

    return screen(def,
      screenHead(def, 'The first step'),
      h('div', { class: 'fs-top' },
        h('section', { class: 'fs-slides', 'aria-labelledby': 'slides-title' },
          h('h2', { id: 'slides-title', class: 'label' }, 'The test carousel'),
          slidesEl),
        h('div', { class: 'fs-rule' },
          h('div', { class: 'kw' },
            h('p', { class: 'label' }, 'Reply keyword'),
            h('p', { class: 'kw-line' }, h('span', { class: 'kw-chip', 'data-testid': 'keyword' }, str(FS.keyword)))),
          h('div', { class: 'decision', 'data-testid': 'decision-rule' },
            h('p', { class: 'label' }, 'Decision rule'),
            bands))),
      h('section', { class: 'fs-steps', 'aria-labelledby': 'steps-title' },
        h('h2', { id: 'steps-title', class: 'label' }, 'Next steps'),
        h('ol', { class: 'steps' }, steps.map((s) => h('li', { class: `step${s === askStep ? ' is-ask' : ''}`, 'data-testid': 'next-step' },
          h('time', { class: 'step-date', datetime: str(s.date) }, stepDate(s.date)),
          h('p', { class: 'step-what' }, str(s.what)),
          chip(s.owner))))),
      ask);
  }

  /* ================================================================ chrome: top bar, badge, nav */

  const byTag = (tag, id, cls) => {
    let el = document.getElementById(id);
    if (!el) {
      el = document.createElement(tag);
      el.id = id;
      if (cls) el.className = cls;
      document.body.appendChild(el);
    }
    return el;
  };
  const topbar = byTag('header', 'topbar', 'topbar');
  const badge = byTag('div', 'badge', 'badge');
  const app = byTag('main', 'app');
  const nav = byTag('nav', 'nav', 'nav');
  // One polite live region in the chrome: screen changes are spoken however they happen.
  let announcer = document.getElementById('announcer');
  if (!announcer) { announcer = h('p', { id: 'announcer', class: 'sr-only' }); topbar.appendChild(announcer); }
  announcer.setAttribute('aria-live', 'polite');
  announcer.setAttribute('aria-atomic', 'true');

  badge.setAttribute('data-testid', 'badge');
  badge.replaceChildren(h('span', { class: 'badge-text' }, figs(`Concept mock-up · not live · prepared for ${str(META.preparedFor) || FIRST} · ${fmtDate(META.date)}`)));

  const counterIdx = h('span', { class: 'tb-count' });
  const counterName = h('span', { class: 'tb-screen' });
  topbar.appendChild(h('div', { class: 'tb-id' },
    h('span', { class: 'tb-avatar', 'aria-hidden': 'true' }, INITIALS),
    h('span', { class: 'tb-name' }, NAME),
    HANDLE ? h('span', { class: 'tb-handle' }, `@${HANDLE}`) : null));
  topbar.appendChild(h('p', { class: 'tb-counter' }, counterIdx, h('span', { class: 'tb-sep', 'aria-hidden': 'true' }, '·'), counterName));

  const prevName = h('span', { class: 'pager-name' });
  const nextName = h('span', { class: 'pager-name' });
  const prevBtn = h('button', { type: 'button', class: 'pager pager-prev', 'data-testid': 'prev' },
    icon('left', 18), h('span', { class: 'pager-text' }, h('span', { class: 'pager-k' }, 'Previous'), prevName));
  const nextBtn = h('button', { type: 'button', class: 'pager pager-next', 'data-testid': 'next' },
    h('span', { class: 'pager-text' }, h('span', { class: 'pager-k' }, 'Next'), nextName), icon('right', 18));
  const dots = SCREENS.map((s) => h('a', { class: 'dot', href: `#${s.id}`, 'data-testid': 'dot', 'aria-label': `Go to ${s.name}` },
    h('span', { class: 'dot-mark', 'aria-hidden': 'true' })));
  nav.appendChild(prevBtn);
  nav.appendChild(h('div', { class: 'dots' }, dots));
  nav.appendChild(nextBtn);

  /* ================================================================ build the screens */

  const renderers = {
    cover: renderCover, demand: renderDemand, offer: renderOffer, inside: renderInside,
    numbers: renderNumbers, plan: renderPlan, 'first-step': renderFirstStep,
  };
  const sections = SCREENS.map((def) => {
    const sec = renderers[def.id](def);
    app.appendChild(sec);
    return sec;
  });

  /* ================================================================ theme tone (native controls follow the ground colour) */

  (() => {
    const g = getComputedStyle(document.documentElement).getPropertyValue('--ground').trim();
    const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(g);
    if (!m) return;
    let hex = m[1];
    if (hex.length === 3) hex = hex.split('').map((c) => c + c).join('');
    const lin = (i) => { const c = parseInt(hex.slice(i, i + 2), 16) / 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
    const lum = 0.2126 * lin(0) + 0.7152 * lin(2) + 0.0722 * lin(4);
    const tone = lum < 0.35 ? 'dark' : 'light';
    document.documentElement.style.colorScheme = tone;
    document.documentElement.setAttribute('data-tone', tone);
  })();

  /* ================================================================ layout: keep body padding in step with the fixed bars */

  const measure = () => {
    const rs = document.documentElement.style;
    rs.setProperty('--top-h', `${topbar.offsetHeight}px`);
    rs.setProperty('--nav-h', `${nav.offsetHeight}px`);
    rs.setProperty('--badge-h', `${badge.offsetHeight}px`);
  };
  measure();
  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(() => window.requestAnimationFrame(measure));
    [topbar, nav, badge].forEach((el) => ro.observe(el));
  } else {
    window.addEventListener('resize', measure);
  }

  /* ================================================================ routing */

  let current = null;

  const idFromHash = () => {
    let id = '';
    try { id = decodeURIComponent(window.location.hash.replace(/^#/, '')); } catch (e) { id = ''; }
    return IDS.indexOf(id) >= 0 ? id : null;
  };

  function show(id) {
    const idx = IDS.indexOf(id);
    const changed = id !== current;
    const previous = current;
    current = id;
    sections.forEach((sec) => {
      const on = sec.getAttribute('data-screen') === id;
      sec.hidden = !on;
      sec.classList.toggle('is-active', on);
    });
    const last = IDS.length - 1;
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx >= last;
    prevName.textContent = idx > 0 ? SCREENS[idx - 1].name : '';
    nextName.textContent = idx < last ? SCREENS[idx + 1].name : '';
    prevBtn.setAttribute('aria-label', idx > 0 ? `Previous: ${SCREENS[idx - 1].name}` : 'Previous');
    nextBtn.setAttribute('aria-label', idx < last ? `Next: ${SCREENS[idx + 1].name}` : 'Next');
    dots.forEach((d, i) => { if (i === idx) d.setAttribute('aria-current', 'step'); else d.removeAttribute('aria-current'); });
    counterIdx.textContent = `${pad2(idx + 1)} / ${pad2(IDS.length)}`;
    counterName.textContent = byId(id).name;
    document.body.setAttribute('data-screen-active', id);

    if (id === 'first-step') fitSlides();
    if (!changed) return;
    window.scrollTo(0, 0);
    const ae = document.activeElement;
    const inChrome = ae && ae !== document.body && (nav.contains(ae) || topbar.contains(ae)) && !ae.disabled;
    if (!inChrome) {
      announcer.textContent = '';
      const hd = document.getElementById(`h-${id}`);
      if (hd) hd.focus({ preventScroll: true });
    } else if (previous !== null) {
      announcer.textContent = `${idx + 1} of ${IDS.length}: ${byId(id).name}`;
    }
  }

  function route() {
    let id = idFromHash();
    if (!id) {
      id = 'cover';
      try {
        window.history.replaceState(window.history.state, '', '#cover');
      } catch (e) {
        window.location.replace('#cover');
        return;
      }
    }
    show(id);
  }

  function go(id) {
    if (IDS.indexOf(id) < 0) return;
    if (idFromHash() === id) show(id);
    else window.location.hash = id;
  }

  const step = (delta) => {
    const to = IDS.indexOf(current) + delta;
    if (to >= 0 && to < IDS.length) go(IDS[to]);
  };

  prevBtn.addEventListener('click', () => step(-1));
  nextBtn.addEventListener('click', () => step(1));
  window.addEventListener('hashchange', route);

  // A focused horizontal scroller (the carousel strip on a phone, a wide table) keeps both arrows.
  const inHorizontalScroller = (el) => {
    for (let n = el; n && n !== document.body && n !== document.documentElement; n = n.parentElement) {
      if (n.scrollWidth > n.clientWidth + 1) {
        const ox = getComputedStyle(n).overflowX;
        if (ox === 'auto' || ox === 'scroll') return true;
      }
    }
    return false;
  };

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || e.defaultPrevented || e.isComposing) return;
    const t = e.target;
    if (t && t.nodeType === 1) {
      if (t.isContentEditable) return;
      if (t.closest('input, select, textarea, [contenteditable]:not([contenteditable="false"]), [role="slider"]')) return;
      if (inHorizontalScroller(t)) return;
    }
    const to = IDS.indexOf(current) + (e.key === 'ArrowRight' ? 1 : -1);
    if (to < 0 || to >= IDS.length) return;
    e.preventDefault();
    go(IDS[to]);
  });

  // The carousel scale depends on the rendered size and the web fonts.
  let fitQueued = false;
  const refit = () => {
    if (current !== 'first-step' || fitQueued) return;
    fitQueued = true;
    window.requestAnimationFrame(() => { fitQueued = false; if (current === 'first-step') fitSlides(); });
  };
  window.addEventListener('resize', refit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit).catch(() => {});

  if ('scrollRestoration' in window.history) window.history.scrollRestoration = 'manual';
  route();
})();
</script>
</body>
</html>
